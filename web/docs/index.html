<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>grant-radar · 문서</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <style>
    :root{
      --accent:#0066FF; --ink:#16181d; --muted:#5b6471; --line:#e7e9ee;
      --bg:#ffffff; --side:#f7f8fa; --code-bg:#f4f6f8;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
      color:var(--ink); background:var(--bg); line-height:1.7;
    }
    .layout{display:grid; grid-template-columns:264px 1fr; min-height:100vh}
    /* sidebar */
    aside{
      background:var(--side); border-right:1px solid var(--line);
      padding:28px 20px; position:sticky; top:0; height:100vh; overflow:auto;
    }
    .brand{display:flex; align-items:center; gap:10px; margin-bottom:6px}
    .brand svg{width:28px;height:28px;border-radius:7px}
    .brand b{font-size:16px; letter-spacing:-.01em}
    .brand small{display:block; color:var(--muted); font-size:12px; font-weight:500; margin-top:2px}
    nav{margin-top:24px; display:flex; flex-direction:column; gap:2px}
    nav a{
      display:block; padding:9px 12px; border-radius:9px; color:var(--ink);
      text-decoration:none; font-size:14px; font-weight:500;
    }
    nav a:hover{background:#eef0f4}
    nav a.active{background:var(--accent); color:#fff}
    nav .raw{color:var(--muted); font-size:12px; font-weight:500; padding:6px 12px; text-decoration:none; display:block}
    nav .raw:hover{color:var(--accent)}
    .sec{margin-top:22px; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); padding:0 12px 6px}
    /* content */
    main{padding:56px 64px; max-width:860px}
    .md h1{font-size:30px; letter-spacing:-.02em; margin:0 0 8px; line-height:1.25}
    .md h2{font-size:21px; margin:38px 0 12px; padding-bottom:8px; border-bottom:1px solid var(--line); letter-spacing:-.01em}
    .md h3{font-size:16px; margin:26px 0 8px}
    .md h4{font-size:14px; margin:20px 0 6px; color:var(--muted)}
    .md p,.md li{font-size:15px}
    .md a{color:var(--accent); text-decoration:none}
    .md a:hover{text-decoration:underline}
    .md code{background:var(--code-bg); padding:.15em .4em; border-radius:6px; font-size:.88em;
      font-family:'SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .md pre{background:var(--code-bg); padding:16px 18px; border-radius:12px; overflow:auto; border:1px solid var(--line)}
    .md pre code{background:none; padding:0; font-size:13px; line-height:1.6}
    .md table{border-collapse:collapse; width:100%; margin:14px 0; font-size:14px}
    .md th,.md td{border:1px solid var(--line); padding:9px 12px; text-align:left; vertical-align:top}
    .md th{background:var(--side); font-weight:600}
    .md blockquote{margin:14px 0; padding:10px 16px; border-left:3px solid var(--accent);
      background:#f3f7ff; border-radius:0 8px 8px 0; color:#33415c}
    .md blockquote p{margin:4px 0}
    .md hr{border:none; border-top:1px solid var(--line); margin:28px 0}
    .topbar{display:none}
    @media(max-width:820px){
      .layout{grid-template-columns:1fr}
      aside{position:static; height:auto; border-right:none; border-bottom:1px solid var(--line)}
      main{padding:32px 22px}
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside>
      <div class="brand">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <rect width="100" height="100" fill="#0066FF"/>
          <g fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M50 50 73 35"/><path d="M50 23a27 27 0 1 0 27 27"/><path d="M50 38a12 12 0 1 0 12 12"/>
          </g>
        </svg>
        <div><b>grant-radar</b><small>문서 · docs</small></div>
      </div>
      <div class="sec">시작하기</div>
      <nav id="nav">
        <a data-doc="guide.md" href="#/guide">사용 설명서</a>
        <a data-doc="API-SPEC.md" href="#/api">API/MCP 연동</a>
        <a data-doc="source-spec.md" href="#/source">출처 명세서</a>
      </nav>
      <div class="sec">바로가기</div>
      <a class="raw" href="/" >← 웹앱 열기</a>
      <a class="raw" id="rawlink" href="guide.md" target="_blank">원문(.md) 보기 ↗</a>
    </aside>
    <main><article class="md" id="content">불러오는 중…</article></main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script>
    const DOCS = {
      '/guide':   'guide.md',
      '/handoff': 'API-SPEC.md',
      '/source':  'source-spec.md',
      '/api':     'API-SPEC.md',
    };
    const content = document.getElementById('content');
    const rawlink = document.getElementById('rawlink');
    const navEls = [...document.querySelectorAll('#nav a')];

    async function render(){
      const route = location.hash.replace(/^#/, '') || '/guide';
      const file = DOCS[route] || DOCS['/guide'];
      navEls.forEach(a => a.classList.toggle('active', a.getAttribute('data-doc') === file));
      rawlink.href = file;
      try{
        const res = await fetch(file, { cache: 'no-cache' });
        if(!res.ok) throw new Error('HTTP ' + res.status);
        const md = await res.text();
        content.innerHTML = marked.parse(md);
        document.title = 'grant-radar · ' + (content.querySelector('h1')?.textContent || '문서');
        window.scrollTo(0,0);
      }catch(e){
        content.innerHTML = '<p>문서를 불러오지 못했습니다: ' + e.message + '</p>';
      }
    }
    window.addEventListener('hashchange', render);
    render();
  </script>
</body>
</html>
